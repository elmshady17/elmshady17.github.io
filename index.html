<!DOCTYPE html>
<html>
    <head>
        <title>TableFinder</title>
    </head>

    <body>
        <h1>Where are you sitting?</h1>
        <img src="images/TrashCan.jpg" alt="Image of a trash can" width="50%" height="30%">
        
        <script>
            const canvas = document.getElementById("myCanvas");
            const ctx = canvas.getContext("2d");

            ctx.rect(10,10,150,100);
            ctx.stroke();
        </script>
