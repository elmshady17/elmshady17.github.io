<html>

    <body>
        <h1>Where are you sitting?</h1>
        
        <div class="image - container">
        <img src="images/TestImageForTableFinder.png" alt="Image of a rough layout of hilltop">
        <div class="overlay"></div>

        <style>
            .image container {
                position: relative;
                width: 500px;
                height: 300px;
            }
 
            .image container img {
                 width: 100%;
                height: 100%;
            }
 
            .overlay {
                position: absolute;
                top: 200px;
                left: 200px;
                width: 30%;
                height: 20%;
                background-color: rgba(255, 0, 0, 0.374);
            }
            
        

        <!--Grid or Gridbox use divs in the grid put rectangles in the divs customize them how you want-->
